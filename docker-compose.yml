services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-performance-lab-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-performance-lab-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./sql:/sql
    environment:
      - SQL_HOST=sqlserver
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd!
    entrypoint: ["/bin/bash", "/sql/init-db.sh"]
